<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>Mon Frigo Pastel</h1>
  <nav>
    <a href="index.html">Accueil</a>
    <a href="frigo.html">Frigo</a>
    <a href="recettes.html">Recettes</a>
    <a href="courses.html">Courses</a>
    <a href="apropos.html">À propos</a>
    <a href="contact.html" class="active">Contact</a>
  </nav>
</header>
<main class="container">
  <h2>📬 Contactez-nous</h2>
  <p class="hint">Une question, une suggestion de recette ? Écrivez-nous !</p>

  <div class="form-card">
    <form id="contactForm">
      <label for="name">Votre nom</label>
      <input type="text" id="name" required placeholder="Ex: Amira">
      <label for="email">Votre email</label>
      <input type="email" id="email" required placeholder="vous@exemple.com">
      <label for="message">Votre message</label>
      <textarea id="message" required placeholder="Dites-nous tout..."></textarea>
      <button type="submit" class="btn-primary">Envoyer le message</button>
    </form>
    <p id="successMsg" style="display:none;color:#2e7d32;font-weight:700;margin-top:12px;">✓ Merci ! Votre message a bien été enregistré.</p>
  </div>

  <!-- LECTEUR AUDIO TOUT SIMPLE -->
  <div class="info-box" style="margin-top: 40px; text-align: center; display: flex; flex-direction: column; align-items: center;">
    <h3 style="margin-bottom: 10px; color: var(--texte);">🎵 Musique d'ambiance</h3>
    <p style="margin-bottom: 16px; font-size: 0.95rem;">Cliquez sur "Play" pour écouter.</p>
    <audio controls loop style="width: 100%; max-width: 400px;">
      <source src="audio/ambiance.mp3" type="audio/mpeg">
      Votre navigateur ne supporte pas la lecture audio.
    </audio>
  </div>

</main>
<footer>© 2025 Mon Frigo Pastel</footer>

<script>
document.getElementById('contactForm').addEventListener('submit', e => {
  e.preventDefault();
  const name = document.getElementById('name').value;
  document.getElementById('successMsg').textContent = `✓ Merci ${name}, votre message a bien été enregistré !`;
  document.getElementById('successMsg').style.display = 'block';
  e.target.reset();
});
</script>
</body>
</html>
